name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # SPA на Pages: базовый путь проекта + 404.html как фолбэк маршрутов.
      # <base> одновременно задаёт basename для BrowserRouter (src/main.tsx)
      # и правильное разрешение относительных ссылок на ассеты (vite base: './').
      - name: Adapt SPA for project pages
        run: |
          BASE="/centr-razuma-iuu-iubip/"
          sed -i 's|<base href="[^"]*">||g' dist/index.html
          sed -i "s|<head>|<head>\n    <base href=\"${BASE}\">|" dist/index.html
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
